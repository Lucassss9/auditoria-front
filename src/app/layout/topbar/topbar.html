<header class="topo">
  <button
    type="button"
    class="botao botao--fantasma botao--icone botao--pequeno"
    [attr.aria-label]="recolhida() ? 'Expandir menu' : 'Recolher menu'"
    (click)="alternar.emit()"
  >
    <i-lucide
      [img]="recolhida() ? icones.abrir : icones.recolher"
      [size]="16"
      aria-hidden="true"
    ></i-lucide>
  </button>

  @if (obra(); as atual) {
    <span class="contexto">
      <i-lucide [img]="icones.obras" [size]="14" aria-hidden="true"></i-lucide>
      <span class="contexto__nome">{{ atual.nome }}</span>
      <span class="contexto__codigo">{{ atual.codigo }}</span>
      <button
        type="button"
        class="contexto__limpar"
        aria-label="Limpar obra em contexto"
        (click)="limparObra()"
      >
        <i-lucide [img]="icones.fechar" [size]="12" aria-hidden="true"></i-lucide>
      </button>
    </span>
  }

  <span class="espaco"></span>

  @if (usandoMock) {
    <span class="selo selo--atencao demonstracao">
      <i-lucide [img]="icones.atencao" [size]="12" aria-hidden="true"></i-lucide>
      Demonstração
    </span>
  }

  <app-seletor-tema />

  <div class="conta">
    <button
      type="button"
      class="conta__botao"
      [attr.aria-expanded]="menuAberto()"
      aria-haspopup="menu"
      (click)="alternarMenu()"
    >
      <span class="conta__iniciais">{{ usuario()?.iniciais ?? '--' }}</span>
      <span class="conta__nome">{{ usuario()?.nome }}</span>
    </button>

    @if (menuAberto()) {
      <div class="menu" role="menu">
        <div class="menu__pessoa">
          <span class="menu__nome">{{ usuario()?.nome }}</span>
          <span class="menu__email">{{ usuario()?.email }}</span>
          <span class="menu__cargo">{{ usuario()?.cargo }}</span>
        </div>
        <a class="menu__item" role="menuitem" routerLink="/configuracoes" (click)="fecharMenu()">
          <i-lucide [img]="icones.configuracoes" [size]="14" aria-hidden="true"></i-lucide>
          Configurações
        </a>
        <button type="button" class="menu__item menu__item--saida" role="menuitem" (click)="sair()">
          <i-lucide [img]="icones.sair" [size]="14" aria-hidden="true"></i-lucide>
          Sair da conta
        </button>
      </div>
    }
  </div>
</header>
