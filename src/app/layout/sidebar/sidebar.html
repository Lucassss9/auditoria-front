<nav class="lateral" [class.lateral--recolhida]="recolhida()" aria-label="Navegação principal">
  <a class="marca" routerLink="/inicio" aria-label="Contagem, início">
    <app-logo [comTexto]="!recolhida()" [tamanho]="28" />
  </a>

  <ul class="lista">
    @for (item of principais; track item.rota) {
      <li>
        <a
          class="link"
          [routerLink]="item.rota"
          routerLinkActive="link--ativo"
          [routerLinkActiveOptions]="{ exact: item.exato }"
          [attr.title]="recolhida() ? item.rotulo : null"
        >
          <i-lucide [img]="item.icone" [size]="17" aria-hidden="true"></i-lucide>
          @if (recolhida()) {
            <span class="visivel-leitor">{{ item.rotulo }}</span>
          } @else {
            <span class="link__texto">{{ item.rotulo }}</span>
          }
        </a>
      </li>
    }
  </ul>

  <ul class="lista lista--rodape">
    <li>
      <a
        class="link link--secundario"
        routerLink="/configuracoes"
        routerLinkActive="link--ativo"
        [attr.title]="recolhida() ? 'Configurações' : null"
      >
        <i-lucide [img]="icones.configuracoes" [size]="16" aria-hidden="true"></i-lucide>
        @if (recolhida()) {
          <span class="visivel-leitor">Configurações</span>
        } @else {
          <span class="link__texto">Configurações</span>
        }
      </a>
    </li>
  </ul>
</nav>
