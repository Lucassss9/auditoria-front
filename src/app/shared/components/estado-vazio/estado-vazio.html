<div class="vazio">
  <i-lucide [img]="icones.vazio" [size]="28" class="vazio__icone" aria-hidden="true"></i-lucide>
  <p class="vazio__titulo">{{ titulo() }}</p>
  @if (descricao()) {
    <p class="vazio__descricao">{{ descricao() }}</p>
  }
  <div class="vazio__acao">
    <ng-content />
  </div>
</div>
