<div class="vazio">
  <span class="vazio__icone">
    <i-lucide [img]="icones.vazio" [size]="20" aria-hidden="true"></i-lucide>
  </span>
  <p class="vazio__titulo">{{ titulo() }}</p>
  @if (descricao()) {
    <p class="vazio__descricao">{{ descricao() }}</p>
  }
  <div class="vazio__acao">
    <ng-content />
  </div>
</div>
